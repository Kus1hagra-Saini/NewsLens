name: ingest

# Schedule is intentionally commented out during Week 1.
# It will be enabled only after `python -m src.ingestion.run --once` has been
# verified against Neon `dev` for all 5 Phase-1 outlets. Until then, kick off
# runs manually with the `workflow_dispatch` trigger below.
on:
  # schedule:
  #   - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Run ingestion
        run: uv run python -m src.ingestion.run
