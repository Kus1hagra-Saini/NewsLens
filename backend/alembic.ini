# Alembic config for NewsLens.
# The database URL is NOT written here; it is read from DATABASE_URL by
# alembic/env.py so the same config works locally, in CI, and in Render.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migrations use the sync psycopg driver even though the app uses asyncpg;
# Alembic does not need the async engine for schema work.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
