[project]
name = "newslens-backend"
version = "0.1.0"
description = "NewsLens backend — FastAPI, ingestion, and analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"

# Stack pinned per architecture §7. Do not substitute technologies without
# updating the architecture document first.
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",          # sync driver, for Alembic
    "alembic>=1.13",
    "pgvector>=0.3",

    # Ingestion
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "tenacity>=9.0",

    # NLP / LLM
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "groq>=0.11",

    # Export
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
